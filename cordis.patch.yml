# dsh-model-router bundle patch.
#
# Inserted after the shipped bundle layers of the profile it is installed
# into, so it overrides nothing but adds one row: the router itself. All
# routing decisions live in the plugin's config here — there are no other
# rows to patch because the `agent/request` rewrite applies to every agent
# regardless of which preset or mode mounts the delegation tools.
- insert:
    - id: model-router
      name: 'dsh-model-router'
      config:
        # The session's root agent: planning, design, review, synthesis.
        planner:
          provider: deepseek-official
          model: deepseek-v4-pro
          # reasoningEffort: high   # optional: off | low | high | max (omit to inherit)
          # maxTokens: 8192        # optional output-token cap (omit to inherit)
        # Every delegated subagent: code writing and execution.
        executor:
          provider: deepseek-official
          model: deepseek-v4-flash
          # reasoningEffort: high
          # maxTokens: 16384
          # escalateOnError: true   # v1: after a failed step, escalate effort
          # escalateTo: max         #   to this level for the next request…
          # recoverySteps: 2        #   …wearing off after N clean steps
        # strict: root is always the planner (pro).
        # plan:   root is pro only while plan mode is active; otherwise it
        #         falls back to the executor route to reserve pro for planning.
        mode: strict
        # enabled: false  # off switch — GUI: Settings → Plugins → model-router (live, no restart); patch row needs a reboot
        # Publish the always-on routing convention prompt section.
        promptSection: true
        # Register the `pro-flash-routing` skill in the session catalog.
        skill: true
